name: Polymorphic Plugin CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      ECDSA_PUBKEY:
        description: '🛡️ ECDSA 签名公钥 (必填)'
        required: true
        type: string
      ECIES_PUBKEY:
        description: '🔐 ECIES 加密公钥 (必填)'
        required: true
        type: string
      KPORT:
        description: '🔌 代理内控端口 (可选，留空默认 8000)'
        required: false
        default: '8000'
        type: string
      ORG:
        description: '🎲 变更组织包名 ORG (可选，留空则不改)'
        required: false
        type: string
      PACKAGE:
        description: '🔮 变更主类名/项目名 PACKAGE (可选，留空则不改)'
        required: false
        type: string
      VERSION:
        description: '🏷️ 变更插件版本号 VERSION (可选，留空则不改)'
        required: false
        type: string

jobs:
  polymorphic-build:
    name: 🚀 矩阵级多态构建
    runs-on: ubuntu-latest

    steps:
      # 阶段 1: 物理拉取当前仓库的模板代码
      - name: 📂 1. 克隆项目模板代码
        uses: actions/checkout@v4

      # 阶段 2: 部署标准 JDK 17 构建环境
      - name: ☕ 2. 部署 Java 17 原生环境与 Gradle 缓存
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 阶段 3: 智能多态审查
      - name: 🎲 3. 多态克隆边界条件智能审查
        id: check_clone
        run: |
          INPUT_ORG="${{ github.event.inputs.ORG }}"
          INPUT_PACKAGE="${{ github.event.inputs.PACKAGE }}"
          INPUT_VERSION="${{ github.event.inputs.VERSION }}"
          
          DETECTED_MAIN=$(grep -E "^main:" src/main/resources/paper-plugin.yml src/main/resources/plugin.yml 2>/dev/null | head -n1 | awk '{print $2}')
          if [ -n "$DETECTED_MAIN" ]; then
            OLD_NAME=$(echo "$DETECTED_MAIN" | cut -d'.' -f3)
          else
            OLD_NAME="HyperEngine"
          fi

          if [ -n "$INPUT_ORG" ] || [ -n "$INPUT_PACKAGE" ] || [ -n "$INPUT_VERSION" ]; then
            echo "🔥 [状态] 检测到多态变异参数，立即激活 clone.sh 衍生新项目..."
            chmod +x clone.sh
            export ORG="$INPUT_ORG"
            export PACKAGE="$INPUT_PACKAGE"
            export VERSION="$INPUT_VERSION"
            bash clone.sh
            
            TARGET_DIR="$INPUT_PACKAGE"
            [ -z "$TARGET_DIR" ] && TARGET_DIR="$OLD_NAME"
            echo "PROJECT_WORK_DIR=$TARGET_DIR" >> $GITHUB_ENV
            echo "CLONED_STATUS=true" >> $GITHUB_ENV
          else
            echo "ℹ️ [状态] 未指定任何克隆特征变异参数，跳过克隆，就地编译当前模板..."
            echo "PROJECT_WORK_DIR=." >> $GITHUB_ENV
            echo "CLONED_STATUS=false" >> $GITHUB_ENV
          fi

      # 阶段 4: 切换至目标目录，注入密钥，执行 build.sh 构建，并动态锁定 Jar 路径
      - name: ⚡ 4. 注入核心通信特征并执行自动化编译
        run: |
          cd ${{ env.PROJECT_WORK_DIR }}
          chmod +x build.sh setup.sh gradlew 2>/dev/null || true
          
          export KPORT="${{ github.event.inputs.KPORT }}"
          [ -z "$KPORT" ] && export KPORT="8000"
          export ECDSA_PUBKEY="${{ github.event.inputs.ECDSA_PUBKEY }}"
          export ECIES_PUBKEY="${{ github.event.inputs.ECIES_PUBKEY }}"
          
          bash build.sh
          
          # 🌟 核心改进：动态捞取最终生成的那个干净无后缀 Jar 包（排除中间体 raw 和 obfuscated）
          FINAL_JAR=$(ls build/libs/*.jar | grep -v "\-raw" | grep -v "\-obfuscated" | head -n 1)
          echo "FINAL_JAR_PATH=$(pwd)/$FINAL_JAR" >> $GITHUB_ENV

      # 阶段 5: 免 ZIP 纯原生单文件直传
      - name: 📦 5. 提取并上传多态最终 Jar 产物 (直连免解压)
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.FINAL_JAR_PATH }}
          archive: false # 🌟 终极绝杀：强制关闭 ZIP 包装机制，在网页上点击下载直接就是单独的原生 .jar 文件！
          if-no-files-found: error

      # 阶段 6: 渲染执行总结大屏
      - name: 📊 6. 渲染并投递本次构建执行总结报告
        run: |
          echo "### 📊 Kisama Agent 多态构建流水线报告" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "#### 🎯 目标特征与就绪状态" >> $GITHUB_STEP_SUMMARY
          echo "- **变异克隆状态**: \`${{ env.CLONED_STATUS }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **最终编译目录**: \`${{ env.PROJECT_WORK_DIR }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **注入网络端口**: \`${{ github.event.inputs.KPORT || '8000' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🧬 指纹清洗溯源" >> $GITHUB_STEP_SUMMARY
          echo "- **组织名称 (ORG)**: \`${{ github.event.inputs.ORG || '（未改变）' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **主类名称 (PACKAGE)**: \`${{ github.event.inputs.PACKAGE || '（未改变）' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **变体版本 (VERSION)**: \`${{ github.event.inputs.VERSION || '（未改变）' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **受保护的纯净多态 Jar 包已成功直传。请下滑至页面底部直接点击下载，无需再次解压！**" >> $GITHUB_STEP_SUMMARY